name: Deploy Next.js to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      working-directory: ./web
      run: npm ci

    - name: Build Static Export
      working-directory: ./web
      run: npm run build

    - name: Deploy to Hostinger via LFTP
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        sudo apt-get update -y && sudo apt-get install -y lftp
        lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
        set ssl:verify-certificate no
        set ftp:ssl-allow no
        set ftp:passive-mode true
        set net:timeout 30
        set net:max-retries 3
        mirror --reverse --verbose \
          --exclude-glob 'api/*' \
          --exclude-glob 'config.php' \
          --exclude-glob '.git*' \
          --exclude-glob '.env*' \
          ./web/out/ ./
        put ./web/public/.htaccess -o ./.htaccess
        quit
        EOF

