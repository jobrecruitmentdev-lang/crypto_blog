name: Deploy Next.js to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      working-directory: ./web
      run: npm ci

    - name: Build Static Export
      working-directory: ./web
      run: npm run build

    - name: Deploy to Hostinger via LFTP
      run: |
        sudo apt-get update -y && sudo apt-get install -y lftp
        lftp -e "
          set ssl:verify-certificate no;
          set ftp:ssl-allow yes;
          set net:timeout 30;
          set net:max-retries 3;
          set net:reconnect-interval-base 5;
          mirror --reverse --verbose \
            --exclude-glob 'api/*' \
            --exclude-glob 'config.php' \
            --exclude-glob '.git*' \
            --exclude-glob '.env*' \
            ./web/out/ ./;
          quit;
        " -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}"

