<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Blog Post — CryptoDrop</title>
<meta name="description" id="pageDesc" content="">
<link rel="stylesheet" href="css/style.css">
<style>
  .post-body{max-width:760px;margin:0 auto}
  .post-body h1{font-size:32px;font-weight:800;margin:16px 0}
  .post-body .meta{color:var(--muted);font-size:13px;margin-bottom:24px}
  .post-body p{color:var(--muted);font-size:15px;margin-bottom:16px;line-height:1.7}
  .post-thumb{height:280px;border-radius:var(--radius);background:linear-gradient(135deg,var(--accent),#4f8dff);margin-bottom:24px}
</style>
</head>
<body>
<div id="site-header"></div>

<section class="section">
  <div class="wrap post-body">
    <div class="breadcrumb" style="font-size:13px;color:var(--muted);margin-bottom:16px"><a href="index.html">Home</a> / <a href="blog.html">Blog</a> / <span id="crumbTitle"></span></div>
    <div class="post-thumb"></div>
    <span class="blog-tag" id="postTag"></span>
    <h1 id="postTitle"></h1>
    <div class="meta" id="postMeta"></div>
    <div id="postContent"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script>
  mountLayout("blog.html");
  const params = new URLSearchParams(location.search);
  const id = parseInt(params.get("id")) || 0;
  const p = BLOG_POSTS[id] || BLOG_POSTS[0];
  document.getElementById("pageTitle").textContent = `${p.title} — CryptoDrop`;
  document.getElementById("pageDesc").setAttribute("content", p.excerpt);
  document.getElementById("crumbTitle").textContent = p.title;
  document.getElementById("postTag").textContent = p.tag;
  document.getElementById("postTitle").textContent = p.title;
  document.getElementById("postMeta").textContent = `${p.date} · ${p.read} read`;
  document.getElementById("postContent").innerHTML = p.body;
</script>
</body>
</html>
