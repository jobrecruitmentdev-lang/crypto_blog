<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guides — CryptoDrop</title>
<meta name="description" content="Step-by-step guides covering wallet setup, bridging, snapshot mechanics and sybil-safe farming strategy.">
<link rel="canonical" href="https://cryptodrop.example/guides.html">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<section class="section">
  <div class="wrap">
    <div class="breadcrumb" style="font-size:13px;color:var(--muted);margin-bottom:16px"><a href="index.html">Home</a> / Guides</div>
    <div class="section-head">
      <div><h2>Guides</h2><p>Everything you need to farm airdrops safely and effectively</p></div>
    </div>
    <div class="blog-grid" id="guideGrid"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script>
  mountLayout("guides.html");
  document.getElementById("guideGrid").innerHTML = GUIDES.map((g,i)=>`
    <a class="blog-card" href="guide.html?id=${i}" style="display:block">
      <div class="blog-thumb"></div>
      <div class="blog-body">
        <span class="blog-tag">${g.level}</span>
        <h3>${g.title}</h3>
        <p>${g.desc}</p>
      </div>
    </a>`).join("");
</script>
</body>
</html>
