<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latest Crypto Airdrops — CryptoDrop</title>
<meta name="description" content="Browse the newest crypto airdrops added to our directory, updated daily across every major blockchain.">
<link rel="canonical" href="https://cryptodrop.example/latest.html">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<section class="section">
  <div class="wrap">
    <div class="breadcrumb" style="font-size:13px;color:var(--muted);margin-bottom:16px"><a href="index.html">Home</a> / Latest Airdrops</div>
    <div class="section-head">
      <div><h2>Latest Airdrops</h2><p>Newest projects added to our directory, updated daily</p></div>
    </div>
    <div class="filter-bar">
      <div class="chip active" data-filter="all">All</div>
      <div class="chip" data-filter="ongoing">Ongoing</div>
      <div class="chip" data-filter="confirmed">Confirmed</div>
      <div class="chip" data-filter="easy">Easy</div>
      <div class="chip" data-filter="medium">Medium</div>
    </div>
    <div class="card-grid" id="latestGrid"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
<script>
  mountLayout("latest.html");
  renderList("latestGrid", [...AIRDROPS].sort((a,b)=>0));
  setupFilters();
</script>
</body>
</html>
