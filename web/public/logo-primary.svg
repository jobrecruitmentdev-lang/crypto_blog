    <path d="M13 19 C13 11, 16.5 4, 20 4 C23.5 4, 27 11, 27 19" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
    <path d="M20 4 V20" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Suspension Strings -->
    <path d="M7 20.5 L16 30 M33 20.5 L24 30 M20 20.5 L20 29" stroke="#8493A8" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Crypto Box/Token -->
