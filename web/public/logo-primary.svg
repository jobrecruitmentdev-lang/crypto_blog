  <text x="52" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="900" fill="#FFFFFF" letter-spacing="-0.03em">Crypto<tspan fill="#00F0FF">Drop</tspan><tspan font-size="12" font-weight="800" fill="#10B981" dx="4" dy="-6">AI</tspan></text>
  
  <defs>
